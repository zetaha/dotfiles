# This config is a STUB! This should never be generated.
# Use the default lua config from https://github.com/hyprwm/Hyprland/blob/main/example/hyprland.lua


env = LIBVA_DRIVER_NAME,nvidia
env = XDG_SESSION_TYPE,wayland
env = GBM_BACKEND,nvidia-drm
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = WLR_NO_HARDWARE_CURSORS,1

# Monitors. DP-2 (LG Ultragear) left, DP-1 (Acer XB271HU) right, both 1440p@144Hz.
# HEADLESS-2 is the virtual output created at the bottom of this file for Sunshine.
# HDMI-A-1 is the 1080p panel used when the DP monitors aren't attached; it is
# positioned `auto` so it doesn't land on top of DP-2 if both are plugged in.
# The final unnamed rule is a catch-all: any display not matched above still
# lights up at its preferred mode, so a fresh machine is never left blind.
monitor = DP-2, 2560x1440@144, 0x0, 1
monitor = DP-1, 2560x1440@144, 2560x0, 1
monitor = HEADLESS-2, 2560x1440@144, 5120x0, 1.67
monitor = HDMI-A-1, 1920x1080@144, auto, 1
monitor = , preferred, auto, 1

$mainMod = SUPER
$terminal = ghostty
$fileManager = thunar
$menu = wofi --show drun
exec-once = hyprpaper & sleep 1 && hyprctl hyprpaper wallpaper "DP-1,/home/zetaha/Pictures/wallpapers/jinx.jpg"; hyprctl hyprpaper wallpaper "DP-2,/home/zetaha/Pictures/wallpapers/jinx.jpg"; hyprctl hyprpaper wallpaper "HEADLESS-2,/home/zetaha/Pictures/wallpapers/jinx.jpg"; hyprctl hyprpaper wallpaper "HDMI-A-1,/home/zetaha/Pictures/wallpapers/jinx.jpg"
exec-once = waybar
exec-once = systemctl --user start hyprpolkitagent
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = sunshine
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY_SETTINGS XDG_CURRENT_DESKTOP HYPRLAND_INSTANCE_SIGNATURE
exec-once = systemctl --user restart xdg-desktop-portal.service xdg-desktop-portal-hyprland.service xdg-desktop-porta-gtk.service
exec-once = hyprctl output create headless

# Mouse: SUPER + left-drag = move, SUPER + right-drag = resize
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

bind = $mainMod, Q, exec, $terminal
bind = $mainMod, C, killactive,
bind = $mainMod, M, exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, togglefloating,
bind = $mainMod, F, fullscreen, 0
bind = $mainMod, R, exec, $menu

# Pin workspaces per monitor: 1-4 = left (DP-2), 5-8 = right (DP-1)
workspace = 1, monitor:DP-2, persistent:true, default:true
workspace = 2, monitor:DP-2, persistent:true
workspace = 3, monitor:DP-2, persistent:true
workspace = 4, monitor:DP-2, persistent:true
workspace = 5, monitor:DP-1, persistent:true, default:true
workspace = 6, monitor:DP-1, persistent:true
workspace = 7, monitor:DP-1, persistent:true
workspace = 8, monitor:DP-1, persistent:true

# Switch workspace
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, d, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8

# Move focused window to workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, d, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8

# Special workspace (scratchpad) — SUPER+S summons it, SUPER+SHIFT+S sends a window to it
bind = $mainMod, S, togglespecialworkspace,
bind = $mainMod SHIFT, S, movetoworkspace, special

bind = CTRL SHIFT, SPACE, exec, 1password --quick-access --silent

# Clipboard history: SUPER+SHIFT+V picks from cliphist via wofi
bind = $mainMod SHIFT, V, exec, cliphist list | wofi --dmenu | cliphist decode | wl-copy

# Screenshots: open in swappy for annotation, then Ctrl+S to save / Ctrl+C to copy
# Print          -> full screen
# SUPER + Print  -> region
bind = , Print,          exec, grim - | swappy -f -
bind = $mainMod, Print,  exec, grim -g "$(slurp)" - | swappy -f -

# No gaps, no animations
general {
    gaps_in = 0
    gaps_out = 0
}

decoration {
    rounding = 0
}

animations {
    enabled = false
}
