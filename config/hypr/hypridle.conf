# Idle management for the Hyprland session.
# Displays blank after 10 minutes of no input; any input wakes them again.
# No lock/suspend listeners on purpose — this box streams via Sunshine, so
# suspending or locking it out from under a remote session is undesirable.

general {
    # Respect apps that ask to stay awake (video players, browsers full-screen,
    # Sunshine while a client is connected) via the Wayland idle-inhibit protocol.
    ignore_dbus_inhibit = false
    ignore_systemd_inhibit = false
}

listener {
    timeout = 600                            # 10 minutes
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}
